include hyde.conf

# Minimal Tab bar styling 
tab_bar_edge                top
tab_bar_style               fade
tab_powerline_style         slanted
tab_title_template          "{index}. {title}"

# remap to open new kitty tab in the same directory (default is home dir)
# map ctrl+shift+t            new_tab_with_cwd

# Uncomment the following 4 lines to minimize kitty latency (higher energy usage)
# input_delay 0
# repaint_delay 2
# sync_to_monitor no
# wayland_enable_ime no

map ctrl+shift+e next_tab
map ctrl+shift+q previous_tab
map ctrl+shift+t set_tab_title

map ctrl+shift+enter new_tab
map ctrl+shift+c new_tab
map ctrl+shift+ž new_tab

